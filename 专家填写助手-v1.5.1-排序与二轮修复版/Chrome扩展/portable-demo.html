<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专家填写助手 · 逐步解锁演示</title><style>*{box-sizing:border-box}body{margin:0;padding:35px 24px;background:#f5f7fb;color:#334761;font:14px/1.9 "Microsoft YaHei",sans-serif}main{max-width:900px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:26px;margin:0}p{color:#8292a9;font-size:13px}button{font:inherit;border:1px solid #d5e1f1;border-radius:7px;padding:8px 15px;background:#fff;color:#3766a7;cursor:pointer}a{color:#2563eb}.instructions{border:1px solid #d6e3f8;background:#edf4ff;border-radius:10px;padding:18px 23px;margin:22px 0;font-size:13px;color:#5e7ca7}.instructions b{color:#2e5b9b}section{border:1px solid #e0e7f1;background:#fff;border-radius:10px;padding:24px;margin-bottom:20px}section h2{font-size:18px;margin:0 0 16px}label.field{display:block;font-size:12px;color:#7386a1;margin:17px 0 7px}textarea,input[type=text],select{font:inherit;color:#304764;border:1px solid #d8e2ef;border-radius:6px;width:100%;padding:10px;line-height:1.6;background:#fcfdff}textarea{min-height:100px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.gate{padding:20px;background:#edf5ff;border:1px dashed #bcd2f3;border-radius:10px;margin-bottom:22px;color:#6384b4}#later{display:none}.badge{background:#eaf3ff;color:#4e7bbb;border-radius:5px;padding:3px 8px;font-size:11px}.rank-group{display:inline-flex;flex-direction:column;background:#f6faff;border:1px solid #bcd1f1;border-radius:8px;padding:12px;margin:4px;min-width:100px}.rank-drag{padding:6px;border:1px solid #dae5f3;border-radius:5px;cursor:grab;background:white;font-size:12px;margin-top:6px}.dropzone{padding:10px;border:1px dashed #a7bfdf;border-radius:7px;margin:10px}.file-names{font-size:12px;color:#7b94b5}.review{display:none}.confirm{display:flex;gap:12px;align-items:center}.footer{font-size:12px;color:#a0adbe}@media(max-width:600px){body{padding:22px 14px}.top{display:block}.two{grid-template-columns:1fr}}</style><main><div class="top"><div><h1>逐步解锁演示 <span class="badge">本地预览</span></h1><p>题目 ID：<span id="item">90000000001</span></p></div><button id="next">清空并切到下一题</button></div><div class="instructions"><b>本地填写区预览：</b>此页用于查看字段和逐步解锁效果，可勾选下方“演示解锁后半部分”显示更多字段。<br>专家填写助手只读取和填写正式的 AI数据服务平台标签页，此本地页面不作为导入目标。请在正式平台选择题号后使用一键导入。<a href="portable-guide.html">返回安装说明</a></div><div data-field-id="authoring-section"><section><h2>1 出题内容</h2><div class="two"><div><label class="field">题目类型</label><div data-field-id="question-type-radio"><label><input type="radio" name="kind" value="openRecommendation">开放推荐</label> <label><input type="radio" name="kind" value="analysisDecision">分析决策</label> <label><input type="radio" name="kind" value="howTo">How-to</label></div></div><div><label class="field">题目领域</label><select data-field-id="question-domain-select"><option value="">请选择</option><option>生活娱乐</option><option>理工科（非计算机/数理）</option><option>计算机</option><option>数理</option><option>人文社科</option><option>医学</option><option>商业财经</option></select></div></div><label class="field">题目Prompt</label><textarea data-field-id="question-input" maxlength="5000"></textarea><label class="field">出题说明（关键洞察 insight）</label><textarea data-field-id="insight-input" maxlength="5000"></textarea><label class="field">决定性核心考点</label><textarea data-field-id="insight-description-input" maxlength="5000"></textarea><label class="field">非决定性核心考点</label><textarea data-field-id="non-decisive-insight-description-input" maxlength="5000"></textarea></section></div><div id="firstModels"></div><div class="gate"><label class="confirm"><input id="unlock" type="checkbox"><span><b>演示解锁后半部分</b><br>勾选后显示随机模型 1、2 及排序说明，再次补填即可填入。</span></label></div><div id="later"><div id="lastModels"></div><section><h2>7 达成性排序</h2><div data-field-id="ranking-drag-list"></div><label class="field">排序说明</label><textarea data-field-id="ranking-reason-input" maxlength="3000"></textarea></section></div><div class="footer">这是本地预览页。正式填写请打开登录后的 AI数据服务平台。</div></main><script src="schema.js"></script><script>
const names=Object.fromEntries(QFSchema.models);
function model(key,i){return `<section data-field-id="${key}-response-card"><h2>${i} ${names[key]}</h2>${key.startsWith('arena')?`<label class="field">实际模型名称</label><input data-field-id="${key}-name-input" type="text" maxlength="100">`:''}<label class="field">Markdown 回复</label><textarea data-field-id="${key}-markdown-input"></textarea><div class="two"><div><label class="field">决定性核心考点是否达成</label><select data-field-id="${key}-achievement-select"><option value="">请选择</option><option>达成</option><option>未达成</option></select></div></div><label class="field">达成性备注</label><textarea data-field-id="${key}-achievement-note-input" maxlength="3000"></textarea><label class="field">回复截图（演示只显示文件名）</label><div data-field-id="${key}-screenshot-upload"><input type="file" data-field-id="${key}-screenshot-file-input" accept="image/*" multiple></div><div class="file-names"></div></section>`;}
document.querySelector('#firstModels').innerHTML=QFSchema.models.slice(0,3).map(([k],i)=>model(k,i+2)).join('');document.querySelector('#lastModels').innerHTML=QFSchema.models.slice(3).map(([k],i)=>model(k,i+5)).join('');
document.querySelector('#unlock').onchange=e=>document.querySelector('#later').style.display=e.target.checked?'block':'none';document.addEventListener('change',e=>{if(e.target.type==='file')e.target.parentElement.nextElementSibling.textContent=Array.from(e.target.files).map(f=>f.name).join('、');});
let groups=QFSchema.models.map(([k])=>[k]),moving;function renderRanks(){const list=document.querySelector('[data-field-id="ranking-drag-list"]');list.innerHTML=groups.map((g,i)=>`<div class="rank-group" data-field-id="ranking-group-${i+1}">第 ${i+1} 名${g.map(k=>`<div draggable="true" class="rank-drag" data-field-id="ranking-drag-${k}">${names[k]}</div>`).join('')}</div>`).join('')+'<div class="dropzone" data-field-id="ranking-new-rank-dropzone">拖到这里新增名次</div>';list.querySelectorAll('[draggable]').forEach(x=>x.ondragstart=e=>{moving=x.dataset.fieldId.replace('ranking-drag-','');e.dataTransfer.setData('text/plain',moving);});list.querySelectorAll('[data-field-id^="ranking-group-"], [data-field-id="ranking-new-rank-dropzone"]').forEach(target=>{target.ondragover=e=>e.preventDefault();target.ondrop=e=>{e.preventDefault();if(!moving)return;const idx=Number(target.dataset.fieldId.replace('ranking-group-',''))-1;const anchor=groups[idx]?.find(k=>k!==moving);const newRank=target.dataset.fieldId==='ranking-new-rank-dropzone';groups=groups.map(g=>g.filter(k=>k!==moving)).filter(g=>g.length);if(newRank)groups.push([moving]);else{const group=groups.find(g=>g.includes(anchor));if(group)group.push(moving);else groups.push([moving]);}renderRanks();};});}renderRanks();
document.querySelector('#next').onclick=()=>{const id=Number(document.querySelector('#item').textContent)+1;document.querySelector('#item').textContent=id;history.pushState({},'','?itemID='+id);document.querySelectorAll('textarea,input[type=text]').forEach(x=>x.value='');document.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(x=>x.checked=false);document.querySelectorAll('select').forEach(x=>x.selectedIndex=0);document.querySelectorAll('input[type=file]').forEach(x=>x.value='');document.querySelectorAll('.file-names').forEach(x=>x.textContent='');document.querySelector('#later').style.display='none';groups=QFSchema.models.map(([k])=>[k]);renderRanks();};
</script></html>
